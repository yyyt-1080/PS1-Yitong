<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333333"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#14877D"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="620" fill="#ffffff"/>

  <!-- ===================== Panel 1: Economics ===================== -->
  <rect x="30" y="30" width="350" height="230" rx="10" fill="#EEF2FF" stroke="#315EFB" stroke-width="2"/>
  <text x="205" y="58" text-anchor="middle" font-size="17" font-weight="bold" fill="#315EFB">Economics</text>
  <text x="205" y="78" text-anchor="middle" font-size="12" fill="#444444">Akerlof (1970)</text>

  <!-- seller/buyer icons -->
  <circle cx="100" cy="130" r="18" fill="#ffffff" stroke="#315EFB" stroke-width="2"/>
  <text x="100" y="135" text-anchor="middle" font-size="13" fill="#315EFB">S</text>
  <circle cx="310" cy="130" r="18" fill="#ffffff" stroke="#315EFB" stroke-width="2"/>
  <text x="310" y="135" text-anchor="middle" font-size="13" fill="#315EFB">B</text>
  <line x1="118" y1="130" x2="292" y2="130" stroke="#315EFB" stroke-width="2" stroke-dasharray="4,3"/>
  <circle cx="205" cy="122" r="13" fill="#FFF3CD" stroke="#B8860B" stroke-width="1.5"/>
  <text x="205" y="127" text-anchor="middle" font-size="14" font-weight="bold" fill="#B8860B">?</text>
  <text x="205" y="160" text-anchor="middle" font-size="11" fill="#555555">quality uncertainty</text>

  <text x="205" y="195" text-anchor="middle" font-size="12" fill="#333333">Information asymmetry about</text>
  <text x="205" y="211" text-anchor="middle" font-size="12" fill="#333333">item quality can depress or</text>
  <text x="205" y="227" text-anchor="middle" font-size="12" fill="#333333">collapse stranger-to-stranger exchange.</text>
  <text x="205" y="248" text-anchor="middle" font-size="11" font-style="italic" fill="#315EFB">market for &#8220;lemons&#8221;</text>

  <!-- ===================== Panel 2: Behavioral ===================== -->
  <rect x="425" y="30" width="350" height="230" rx="10" fill="#EAF7F5" stroke="#14877D" stroke-width="2"/>
  <text x="600" y="58" text-anchor="middle" font-size="17" font-weight="bold" fill="#14877D">Behavioral Science</text>
  <text x="600" y="78" text-anchor="middle" font-size="12" fill="#444444">Morozov &amp; Feigel (2026)</text>

  <!-- repeated stranger interaction -->
  <circle cx="495" cy="130" r="16" fill="#ffffff" stroke="#14877D" stroke-width="2"/>
  <circle cx="600" cy="130" r="16" fill="#ffffff" stroke="#14877D" stroke-width="2"/>
  <circle cx="705" cy="130" r="16" fill="#ffffff" stroke="#14877D" stroke-width="2"/>
  <path d="M511,124 Q548,105 584,124" fill="none" stroke="#14877D" stroke-width="1.6" marker-end="url(#arrowTeal)"/>
  <path d="M616,124 Q653,105 689,124" fill="none" stroke="#14877D" stroke-width="1.6" marker-end="url(#arrowTeal)"/>
  <path d="M584,138 Q548,157 511,138" fill="none" stroke="#14877D" stroke-width="1.6" stroke-dasharray="3,2" marker-end="url(#arrowTeal)"/>
  <text x="600" y="162" text-anchor="middle" font-size="11" fill="#555555">opponent-specific responses</text>

  <text x="600" y="195" text-anchor="middle" font-size="12" fill="#333333">Strangers can sustain cooperation</text>
  <text x="600" y="211" text-anchor="middle" font-size="12" fill="#333333">without full observability, through</text>
  <text x="600" y="227" text-anchor="middle" font-size="12" fill="#333333">responses tailored to a counterpart's</text>
  <text x="600" y="243" text-anchor="middle" font-size="12" fill="#333333">recent behavior.</text>

  <!-- ===================== Panel 3: Computational ===================== -->
  <rect x="820" y="30" width="350" height="230" rx="10" fill="#FDF1EC" stroke="#C2542A" stroke-width="2"/>
  <text x="995" y="58" text-anchor="middle" font-size="17" font-weight="bold" fill="#C2542A">Computer Science</text>
  <text x="995" y="78" text-anchor="middle" font-size="12" fill="#444444">Static Space trust game</text>

  <!-- badge vs no-badge bars -->
  <rect x="880" y="150" width="40" height="60" fill="#C2542A" opacity="0.85"/>
  <text x="900" y="145" text-anchor="middle" font-size="11" fill="#333333">p=0.75</text>
  <text x="900" y="225" text-anchor="middle" font-size="10" fill="#555555">Badge</text>
  <rect x="960" y="186" width="40" height="24" fill="#C2542A" opacity="0.45"/>
  <text x="980" y="181" text-anchor="middle" font-size="11" fill="#333333">p=0.45</text>
  <text x="980" y="225" text-anchor="middle" font-size="10" fill="#555555">No Badge</text>
  <line x1="865" y1="210" x2="1040" y2="210" stroke="#999999" stroke-width="1"/>

  <text x="995" y="195" text-anchor="middle" font-size="12" fill="#333333"> </text>
  <text x="995" y="245" text-anchor="middle" font-size="11" font-style="italic" fill="#C2542A">seed = 42, reproducible in Colab</text>

  <!-- ===================== Converging arrows ===================== -->
  <path d="M205,262 L400,330" fill="none" stroke="#315EFB" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <path d="M600,262 L600,330" fill="none" stroke="#14877D" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <path d="M995,262 L800,330" fill="none" stroke="#C2542A" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>

  <!-- ===================== Central synthesis box ===================== -->
  <rect x="300" y="335" width="600" height="90" rx="10" fill="#2A2E45" />
  <text x="600" y="368" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Lightweight, Auditable AI Trust Signal</text>
  <text x="600" y="392" text-anchor="middle" font-size="12" fill="#D8DCE8">narrows adverse selection · substitutes for full observability</text>
  <text x="600" y="410" text-anchor="middle" font-size="12" fill="#D8DCE8">resource-aware, inspectable, no dedicated compute runtime</text>

  <!-- arrow down to platform -->
  <line x1="600" y1="425" x2="600" y2="470" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===================== Output box ===================== -->
  <rect x="330" y="475" width="540" height="80" rx="10" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="600" y="505" text-anchor="middle" font-size="15" font-weight="bold" fill="#222222">Campus Circular-Economy Platform</text>
  <text x="600" y="527" text-anchor="middle" font-size="12" fill="#444444">completed stranger-to-stranger exchange &#8594; SDG Target 12.5</text>
  <text x="600" y="545" text-anchor="middle" font-size="11" font-style="italic" fill="#666666">indicator: share of initiated requests reaching completion</text>

  <!-- ===================== Footer note ===================== -->
  <text x="600" y="595" text-anchor="middle" font-size="11" fill="#888888">Solid within-panel elements show each discipline's own evidence; dashed arrows show the proposed synthesis.</text>
</svg>
